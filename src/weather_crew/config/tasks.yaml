weather_collection_task:
  description: >
    Collect the weather forecast for {city}, {country}, {administrative_area} between {start_date} and {end_date}.
  expected_output: >
    The weather forecast for {city}, {country}, {administrative_area} for each date in the following format:
    [{date: date, weather_text: weather_text, temperature_min: temperature_min, temperature_max: temperature_max}]
  agent: weather_assistant

activities_planning_task:
  description: >
    Research and find cool things to do at {city}, {country}, {administrative_area} between {start_date} and {end_date}.
    Focus on activities and events that match the weather forecast and the user interests.
    Utilize internet search tools and recommendation engines to gather the information.

    Traveler's information:

    - city: {city}
    - country: {country}
    - administrative_area: {administrative_area}
    - start_date: {start_date}
    - end_date: {end_date}
    - user_interests: {user_interests}

#  - weather forecast: {forecast}

  expected_output: >
    A list of recommended activities and events for the location and each date.
    Each entry should include the activity name, location, booking information (including a link), a brief description
    and why it is appropriate for the weather forecast and why is it appropriate for the user interests.
    And potential reviews and ratings of the activities.
  agent: activities_planner
